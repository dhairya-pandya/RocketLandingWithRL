# TD3 hyperparameters (see rocketlander/agents/td3.py for meanings).
total_steps: 1000000
num_envs: 8
buffer_size: 1000000
batch_size: 256
learning_starts: 50000
updates_per_step: 4
gamma: 0.99
tau: 0.005
learning_rate: 0.0003
reward_scale: 0.1
warmup_policy: pid
warmup_noise: 0.3
exploration_noise: 0.1
policy_noise: 0.2
noise_clip: 0.5
policy_delay: 2
hidden: [128, 128]
log_interval: 10000
eval_interval: 100000
eval_episodes: 20
