[project]
name = "rocketlander"
version = "0.1.0"
description = "Land a rocket on a moving drone ship with reinforcement learning."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "gymnasium>=1.0",
    "pyyaml>=6.0",
    "pygame-ce>=2.5.8",
    "imageio>=2.37.4",
]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rocketlander"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: long-running learning tests; run with: uv run pytest -m slow"]
filterwarnings = ["ignore:.*Box observation space.*:UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.isort]
known-first-party = ["rocketlander"]

[project.scripts]
rl-play = "rocketlander.cli.play:main"
rl-watch = "rocketlander.cli.watch:main"
rl-record = "rocketlander.cli.record:main"
